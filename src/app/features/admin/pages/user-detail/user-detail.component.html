<div class="detail-container min-h-screen bg-slate-50 dark:bg-slate-950">
  @if (isLoading()) {
    <!-- Skeleton loading -->
    <div class="max-w-5xl mx-auto px-4 md:px-6 lg:px-8 py-8" aria-hidden="true">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Skeleton identity card -->
        <div>
          <div class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-6 animate-pulse">
            <div class="flex flex-col items-center text-center space-y-4">
              <div class="w-16 h-16 rounded-2xl bg-slate-200 dark:bg-slate-700"></div>
              <div class="h-5 w-40 rounded bg-slate-200 dark:bg-slate-700"></div>
              <div class="h-6 w-32 rounded-full bg-slate-200 dark:bg-slate-700"></div>
              <div class="w-full space-y-3 pt-4">
                <div class="h-4 w-full rounded bg-slate-200 dark:bg-slate-700"></div>
                <div class="h-4 w-3/4 rounded bg-slate-200 dark:bg-slate-700"></div>
                <div class="h-4 w-1/2 rounded bg-slate-200 dark:bg-slate-700"></div>
              </div>
            </div>
          </div>
        </div>
        <!-- Skeleton info cards -->
        <div class="lg:col-span-2 space-y-6">
          <div class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-5 animate-pulse">
            <div class="h-5 w-40 rounded bg-slate-200 dark:bg-slate-700 mb-5"></div>
            <div class="space-y-3">
              <div class="h-4 w-full rounded bg-slate-200 dark:bg-slate-700"></div>
              <div class="h-4 w-5/6 rounded bg-slate-200 dark:bg-slate-700"></div>
              <div class="h-4 w-2/3 rounded bg-slate-200 dark:bg-slate-700"></div>
            </div>
          </div>
          <div class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-5 animate-pulse">
            <div class="h-5 w-40 rounded bg-slate-200 dark:bg-slate-700 mb-5"></div>
            <div class="flex gap-2">
              <div class="h-6 w-24 rounded-full bg-slate-200 dark:bg-slate-700"></div>
              <div class="h-6 w-16 rounded-full bg-slate-200 dark:bg-slate-700"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  } @else if (user(); as u) {
    <!-- Sticky Header -->
    <div class="sticky top-16 z-[90] bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
      <div class="max-w-5xl mx-auto px-4 md:px-6 lg:px-8 py-4">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <div class="flex items-center gap-3 min-w-0">
            <app-button
              variant="ghost"
              icon="arrow_back"
              label="Quay lại"
              (click)="goBack()"
              ariaLabel="Quay về danh sách người dùng"
            />
            <div class="min-w-0">
              <h1 class="text-xl font-bold text-slate-900 dark:text-white truncate">Chi tiết người dùng</h1>
              <p class="text-sm text-slate-500 dark:text-slate-400 truncate">{{ u.fullName || 'Người dùng' }} · {{ u.email }}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <app-button
              variant="primary"
              icon="edit"
              label="Chỉnh sửa"
              (click)="navigateToEdit()"
            />
            <app-button
              variant="danger"
              icon="delete"
              label="Xóa"
              (click)="deleteUser()"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-5xl mx-auto px-4 md:px-6 lg:px-8 py-8">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Identity Card -->
        <div>
          <app-card [padding]="'lg'">
            <div class="flex flex-col items-center text-center">
              <app-avatar
                [src]="u.avatar"
                [alt]="u.fullName || 'Người dùng'"
                [initials]="getInitials(u.fullName || '')"
                size="xl"
                shape="rounded"
                [shadow]="'lg'"
              />
              <h2 class="text-xl font-bold text-slate-900 dark:text-white truncate w-full mt-4">{{ u.fullName || 'Người dùng' }}</h2>
              <div class="mt-3">
                <app-badge
                  [label]="statusBadge().label"
                  [variant]="statusBadge().variant"
                  [icon]="statusBadge().icon"
                  [size]="'default'"
                />
              </div>
              <div class="my-5 border-t border-slate-100 dark:border-slate-700 w-full"></div>
              <dl class="w-full">
                <app-info-item label="ID" [value]="u.id" icon="fingerprint" [mono]="true" />
                <app-info-item label="Ngày tạo" [value]="formatDate(u.createdAt)" icon="calendar_today" />
                <app-info-item label="Đăng nhập cuối" [value]="formatDate(u.lastLoginAt)" icon="login" />
              </dl>
            </div>
          </app-card>
        </div>

        <!-- Info Column -->
        <div class="lg:col-span-2 space-y-6">
          <!-- Contact Info -->
          <app-card [padding]="'none'">
            <app-card-header icon="alternate_email" title="Thông tin liên hệ" />
            <div class="px-5 pb-5 pt-1">
              <dl>
                <app-info-item label="Email" [value]="u.email" icon="mail" />
                <app-info-item label="Số điện thoại" [value]="u.phone" icon="phone" />
                <app-info-item label="Địa chỉ" [value]="u.address" icon="location_on" />
              </dl>
            </div>
          </app-card>

          <!-- Roles -->
          <app-card [padding]="'default'">
            <app-card-header icon="security" title="Vai trò & Quyền hạn" />
            <div class="flex flex-wrap gap-2">
              @for (roleBadge of roleBadges(); track roleBadge.label) {
                <app-badge
                  [label]="roleBadge.label"
                  [variant]="roleBadge.variant"
                  [size]="'default'"
                />
              } @empty {
                <app-badge label="Chưa có vai trò" variant="neutral" size="sm" />
              }
            </div>
          </app-card>
        </div>
      </div>
    </div>
  } @else {
    <app-empty-state
      variant="no-data"
      icon="person"
      title="Không tìm thấy người dùng"
      description="Người dùng này có thể đã bị xóa hoặc không tồn tại."
      actionLabel="Quay về danh sách"
      actionIcon="arrow_back"
      actionVariant="primary"
      (actionClick)="goBack()"
    />
  }
</div>
