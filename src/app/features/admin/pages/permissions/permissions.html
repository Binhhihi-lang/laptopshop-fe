<div class="permissions-container min-h-screen bg-slate-50 dark:bg-slate-950">
  <!-- Page Header -->
  <div class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-16 z-[90]">
    <div class="max-w-screen-2xl mx-auto px-4 md:px-6 lg:px-8 py-4">
      <app-page-header
        title="Quản lý quyền hạn"
        [subtitle]="'Tìm kiếm và quản lý danh sách quyền hạn (' + filteredPermissions().length + '/' + permissions().length + ')'"
        [hasActions]="true"
      >
        <app-button variant="primary" icon="add" label="Thêm quyền" (click)="createPermission()" />
      </app-page-header>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="max-w-screen-2xl mx-auto px-4 md:px-6 lg:px-8 py-4">
    <app-card [padding]="'sm'" [compact]="true">
      <div class="filter-row flex flex-wrap gap-4 items-end">
        <!-- Search -->
        <div class="relative flex-1 min-w-[250px] max-w-[400px]">
          <app-input
            id="permission-search"
            name="search"
            placeholder="Tìm kiếm theo tên hoặc mô tả..."
            [value]="searchTerm()"
            [icon]="'search'"
            (valueChange)="searchTerm.set($event); onSearchChange()"
            [ariaLabel]="'Tìm kiếm quyền hạn'"
          />
        </div>

        <!-- Clear Filters -->
        @if (hasActiveFilters()) {
          <app-button
            variant="outline"
            icon="filter_alt_off"
            label="Xóa bộ lọc"
            (click)="clearFilters()"
            class="ml-auto"
          />
        }

        <!-- Column Picker -->
        <app-column-picker [columns]="columns()" (toggleColumn)="toggleColumn($event)" />
      </div>
    </app-card>
  </div>

  <!-- Permissions Table -->
  <div class="max-w-screen-2xl mx-auto px-4 md:px-6 lg:px-8 pb-8">
    <app-card [padding]="'none'">
      <app-table
        [data]="filteredPermissions()"
        [columns]="columns()"
        [loading]="isLoading()"
        [loadingText]="'Đang tải quyền hạn...'"
        [actions]="actions()"
        [trackByFn]="trackByPermissionId"
        [sortColumn]="sortColumn()"
        [sortDirection]="sortDirection()"
        (sortChange)="onSort($event)"
        [emptyIcon]="'security'"
        [emptyTitle]="'Không tìm thấy quyền hạn'"
        [emptyDescription]="'Thử thay đổi bộ lọc hoặc thêm quyền hạn mới'"
        [emptyActionLabel]="'Tạo quyền hạn đầu tiên'"
        [emptyActionIcon]="'add'"
        (emptyActionClick)="createPermission()"
      >
        <!-- Name Column Template -->
        <ng-template #nameColumn let-permission>
          <span class="font-mono font-medium text-slate-900 dark:text-white">{{ permission.name }}</span>
        </ng-template>
      </app-table>
    </app-card>
  </div>
</div>
