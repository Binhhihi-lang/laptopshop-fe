<div class="categories-container min-h-screen bg-slate-50 dark:bg-slate-950">
  <!-- Page Header -->
  <div class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-16 z-[90]">
    <div class="max-w-screen-2xl mx-auto px-4 md:px-6 lg:px-8 py-4">
      <app-page-header
        title="Quản lý danh mục"
        [subtitle]="'Tìm kiếm, lọc và quản lý danh mục sản phẩm (' + filteredCategories().length + '/' + categories().length + ')'"
        [hasActions]="true"
      >
        <app-button
          variant="primary"
          icon="add"
          label="Thêm danh mục"
          (click)="router.navigate(['/admin/categories/create'])"
        />
      </app-page-header>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="max-w-screen-2xl mx-auto px-4 md:px-6 lg:px-8 py-4">
    <app-card [padding]="'sm'" [compact]="true">
      <div class="filter-row flex flex-wrap gap-4 items-end">
        <!-- Search -->
        <div class="relative flex-1 min-w-[250px] max-w-[400px]">
          <app-input
            id="category-search"
            name="search"
            placeholder="Tìm theo tên hoặc mô tả..."
            [value]="searchTerm()"
            [icon]="'search'"
            (valueChange)="searchTerm.set($event); onSearchChange()"
            [ariaLabel]="'Tìm kiếm danh mục'"
          />
        </div>

        <!-- Status Filter -->
        <div class="status-filter-group flex items-center gap-2">
          <span class="filter-label text-sm text-slate-600 dark:text-slate-400 font-medium">Trạng thái:</span>
          <div class="flex gap-1 bg-slate-100 dark:bg-slate-800 rounded-lg p-1">
            <button
              type="button"
              (click)="setStatusFilter('all')"
              [class]="statusFilter() === 'all' ? 'bg-white dark:bg-slate-700 shadow-sm text-primary-600 dark:text-primary-400' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white'"
              class="px-3 py-1.5 text-sm rounded-md font-medium transition-colors"
              [attr.aria-pressed]="statusFilter() === 'all'">
              Tất cả
            </button>
            <button
              type="button"
              (click)="setStatusFilter('active')"
              [class]="statusFilter() === 'active' ? 'bg-white dark:bg-slate-700 shadow-sm text-success-600 dark:text-success-400' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white'"
              class="px-3 py-1.5 text-sm rounded-md font-medium transition-colors flex items-center gap-1.5"
              [attr.aria-pressed]="statusFilter() === 'active'">
              <mat-icon class="w-4 h-4">check_circle</mat-icon>
              Hoạt động
            </button>
            <button
              type="button"
              (click)="setStatusFilter('inactive')"
              [class]="statusFilter() === 'inactive' ? 'bg-white dark:bg-slate-700 shadow-sm text-danger-600 dark:text-danger-400' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white'"
              class="px-3 py-1.5 text-sm rounded-md font-medium transition-colors flex items-center gap-1.5"
              [attr.aria-pressed]="statusFilter() === 'inactive'">
              <mat-icon class="w-4 h-4">cancel</mat-icon>
              Ngừng
            </button>
          </div>
        </div>

        <!-- Date range filter -->
        <div class="flex items-end gap-2">
          <label class="flex flex-col gap-1 text-xs text-slate-500 dark:text-slate-400">
            Từ ngày
            <input
              type="date"
              [value]="createdFrom()"
              (change)="createdFrom.set($any($event.target).value); onDateChange()"
              class="h-10 px-3 text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/30"
              aria-label="Lọc từ ngày tạo" />
          </label>
          <label class="flex flex-col gap-1 text-xs text-slate-500 dark:text-slate-400">
            Đến ngày
            <input
              type="date"
              [value]="createdTo()"
              (change)="createdTo.set($any($event.target).value); onDateChange()"
              class="h-10 px-3 text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/30"
              aria-label="Lọc đến ngày tạo" />
          </label>
        </div>

        <!-- Clear Filters -->
        @if (hasActiveFilters()) {
          <app-button
            variant="outline"
            icon="filter_alt_off"
            label="Xóa bộ lọc"
            (click)="clearFilters()"
            class="ml-auto"
          />
        }

        <!-- Column Picker -->
        <app-column-picker [columns]="columns()" (toggleColumn)="toggleColumn($event)" />
      </div>
    </app-card>
  </div>

  <!-- Bulk Actions Toolbar -->
  <app-bulk-toolbar
    [count]="selectedCount()"
    itemLabel="danh mục"
    [buttons]="bulkCategoryButtons()"
    (clear)="selectedCategoryIds.set([])"
  />

  <!-- Categories Table -->
  <div class="max-w-screen-2xl mx-auto px-4 md:px-6 lg:px-8 pb-8">
    <app-card [padding]="'none'">
      <app-table
        [data]="filteredCategories()"
        [columns]="columns()"
        [loading]="isLoading()"
        [loadingText]="'Đang tải danh mục...'"
        [actions]="actions"
        [trackByFn]="trackByCategoryId"
        [selectable]="true"
        [selectedRows]="selectedCategories()"
        (selectionChange)="onSelectionChange($event)"
        [sortColumn]="sortColumn()"
        [sortDirection]="sortDirection()"
        (sortChange)="onSort($event)"
        [emptyIcon]="'category'"
        [emptyTitle]="'Không tìm thấy danh mục'"
        [emptyDescription]="'Thử thay đổi bộ lọc hoặc thêm danh mục mới'"
        [emptyActionLabel]="'Tạo danh mục đầu tiên'"
        [emptyActionIcon]="'add'"
        (emptyActionClick)="router.navigate(['/admin/categories/create'])"
      >
        <!-- Image Column -->
        <ng-template #imageColumn let-category>
          <div class="w-12 h-12 rounded-lg overflow-hidden bg-slate-100 dark:bg-slate-800 flex items-center justify-center mx-auto">
            @if (category.image) {
              <img [src]="category.image" [alt]="category.name" loading="lazy" class="w-full h-full object-cover" />
            } @else {
              <mat-icon class="w-6 h-6 text-slate-400 dark:text-slate-500">category</mat-icon>
            }
          </div>
        </ng-template>

        <!-- Name Column -->
        <ng-template #nameColumn let-category>
          <div class="font-medium text-slate-900 dark:text-white truncate max-w-[280px]">{{ category.name }}</div>
        </ng-template>

        <!-- Description Column -->
        <ng-template #descriptionColumn let-category>
          <span class="text-slate-600 dark:text-slate-400 truncate max-w-[280px] block">{{ category.description || '—' }}</span>
        </ng-template>

        <!-- Display Order Column -->
        <ng-template #displayOrderColumn let-category>
          <span class="text-center text-slate-600 dark:text-slate-400 tabular-nums">{{ category.displayOrder ?? 0 }}</span>
        </ng-template>

        <!-- Product Count Column -->
        <ng-template #productCountColumn let-category>
          <span class="text-slate-900 dark:text-white tabular-nums font-medium">{{ category.productCount ?? 0 }}</span>
        </ng-template>

        <!-- Status Column -->
        <ng-template #statusColumn let-category>
          <app-badge
            [label]="getStatusLabel(category)"
            [variant]="getStatusColor(category)"
            [icon]="getStatusIcon(category)"
            [size]="'default'"
          />
        </ng-template>

        <!-- Created At Column -->
        <ng-template #createdAtColumn let-category>
          <span class="text-slate-600 dark:text-slate-400 whitespace-nowrap">{{ formatDate(category.createdAt) }}</span>
        </ng-template>

        <!-- Updated At Column -->
        <ng-template #updatedAtColumn let-category>
          <span class="text-slate-600 dark:text-slate-400 whitespace-nowrap">{{ formatDate(category.updatedAt) }}</span>
        </ng-template>
      </app-table>
    </app-card>
  </div>
</div>
