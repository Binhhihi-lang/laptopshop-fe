<div class="form-container min-h-screen bg-slate-50 dark:bg-slate-950">

  <!-- Loading -->
  @if (isLoading()) {
    <div class="loading-overlay fixed inset-0 bg-white/80 dark:bg-slate-950/80 flex items-center justify-center z-50">
      <app-loading size="xl" text="Đang tải..." />
    </div>
  }

  <!-- Header -->
  <div class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-16 z-[90]">
    <div class="max-w-6xl mx-auto px-4 md:px-6 lg:px-8 py-4">
      <app-page-header
        [title]="pageTitle()"
        [subtitle]="pageSubtitle()"
        [hasActions]="true"
      >
        <app-button
          variant="ghost"
          icon="arrow_back"
          label="Quay lại"
          (click)="onCancel()"
          [disabled]="isSubmitting()"
        />
      </app-page-header>
    </div>
  </div>

  <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" class="category-form max-w-6xl mx-auto px-4 md:px-6 lg:px-8 py-8 space-y-6">
    <!-- Image Upload Section -->
    <section class="form-section">
      <app-card [padding]="'default'" [variant]="'default'">
        <div class="flex items-center gap-2 mb-4">
          <svg class="w-5 h-5 text-primary-600 dark:text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <h3 class="section-title text-lg font-medium text-slate-900 dark:text-white">Hình ảnh danh mục</h3>
        </div>

        <app-image-upload
          [existingImage]="existingImage()"
          [label]="'Hình ảnh danh mục'"
          [maxSizeMB]="5"
          [disabled]="isSubmitting()"
          (fileChange)="onImageFileChange($event)"
          (imageRemoved)="imageRemoved.set($event)"
        />
      </app-card>
    </section>

    <!-- Basic Information Section -->
    <section class="form-section">
      <app-card [padding]="'default'" [variant]="'default'">
        <div class="flex items-center gap-2 mb-4">
          <svg class="w-5 h-5 text-primary-600 dark:text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <h3 class="section-title text-lg font-medium text-slate-900 dark:text-white">Thông tin cơ bản</h3>
        </div>

        <div class="form-grid grid grid-cols-1 md:grid-cols-2 gap-4">
          <app-form-field id="name-field" label="Tên danh mục" [required]="true" [error]="hasError('name', 'required') ? 'Tên danh mục là bắt buộc' : hasError('name', 'maxlength') ? 'Tên không được vượt quá 200 ký tự' : ''">
            <app-input
              id="name"
              name="name"
              formControlName="name"
              placeholder="VD: Laptop Gaming"
              [maxLength]="200"
              [ariaLabel]="'Tên danh mục'">
            </app-input>
          </app-form-field>

          <app-form-field id="description-field" label="Mô tả" class="md:col-span-2">
            <app-input
              id="description"
              name="description"
              type="textarea"
              formControlName="description"
              [rows]="4"
              placeholder="Mô tả về danh mục này..."
              [ariaLabel]="'Mô tả'">
            </app-input>
          </app-form-field>

          <app-form-field id="displayOrder-field" label="Thứ tự hiển thị" [error]="hasError('displayOrder', 'min') ? 'Thứ tự phải lớn hơn hoặc bằng 0' : ''">
            <app-input
              id="displayOrder"
              name="displayOrder"
              type="number"
              formControlName="displayOrder"
              [min]="'0'"
              [step]="'1'"
              placeholder="VD: 1, 2, 3..."
              [ariaLabel]="'Thứ tự hiển thị'">
            </app-input>
          </app-form-field>
        </div>
      </app-card>
    </section>

    <!-- Status Section -->
    <section class="form-section status-section">
      <app-card [padding]="'default'" [variant]="'default'" [compact]="true">
        <div class="flex items-center gap-2 mb-3">
          <svg class="w-5 h-5 text-primary-600 dark:text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <h3 class="section-title text-lg font-medium text-slate-900 dark:text-white">Trạng thái</h3>
        </div>

        <div class="status-toggle flex items-center gap-3">
          <label class="relative inline-flex items-center cursor-pointer">
            <input
              type="checkbox"
              formControlName="active"
              class="sr-only peer"
              [attr.aria-label]="'Trạng thái hoạt động'">
            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary-300 dark:peer-focus:ring-primary-800 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-slate-600 peer-checked:bg-primary-600"></div>
          </label>
          <span class="toggle-label text-sm font-medium text-slate-700 dark:text-slate-300">
            {{ categoryForm.get('active')?.value ? 'Đang hoạt động' : 'Ngưng hoạt động' }}
          </span>
        </div>
      </app-card>
    </section>

    <!-- Form Actions -->
    <div class="form-actions flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
      <app-button
        type="button"
        variant="outline"
        icon="close"
        label="Hủy"
        [disabled]="isSubmitting()"
        (click)="onCancel()"
        size="default">
      </app-button>
      <app-button
        type="submit"
        variant="primary"
        [icon]="isSubmitting() ? '' : (isEditMode() ? 'save' : 'add')"
        [loading]="isSubmitting()"
        [label]="isSubmitting() ? 'Đang lưu...' : submitButtonText()"
        [disabled]="categoryForm.invalid || isSubmitting()"
        size="default">
      </app-button>
    </div>
  </form>
</div>
