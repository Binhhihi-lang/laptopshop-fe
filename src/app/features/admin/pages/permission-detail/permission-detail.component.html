<div class="detail-container min-h-screen bg-slate-50 dark:bg-slate-950">
  @if (isLoading()) {
    <!-- Skeleton loading -->
    <div class="max-w-4xl mx-auto px-4 md:px-6 lg:px-8 py-8" aria-hidden="true">
      <div class="space-y-6">
        <app-skeleton-card>
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <app-skeleton width="w-48" height="h-8" />
            <app-skeleton width="w-32" height="h-5" />
          </div>
        </app-skeleton-card>
        <app-skeleton-card>
          <app-skeleton width="w-32" height="h-5" class="mb-4" />
          <div class="space-y-3">
            <app-skeleton width="w-full" height="h-4" />
            <app-skeleton width="w-2/3" height="h-4" />
          </div>
        </app-skeleton-card>
      </div>
    </div>
  } @else if (errorMessage()) {
    <app-empty-state
      variant="error"
      icon="error_outline"
      title="Không thể tải quyền hạn"
      [description]="errorMessage()"
      actionLabel="Quay về danh sách"
      actionIcon="arrow_back"
      actionVariant="primary"
      (actionClick)="goBack()"
    />
  } @else if (permission(); as p) {
    <app-detail-header
      [title]="p.name"
      backAriaLabel="Quay về danh sách quyền hạn"
      (backClick)="goBack()"
    >
      <div headerActions class="flex items-center gap-2 sm:ml-auto">
        <app-button
          variant="primary"
          icon="edit"
          label="Chỉnh sửa"
          (click)="goToEdit()"
        />
        @if (canManage()) {
          <app-button
            variant="danger"
            icon="delete"
            label="Xóa"
            (click)="deletePermission()"
          />
        }
      </div>
    </app-detail-header>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto px-4 md:px-6 lg:px-8 py-8 space-y-6">
      <!-- Basic Info -->
      <app-card [padding]="'default'">
        <h3 class="text-title font-semibold text-slate-900 dark:text-white mb-4 flex items-center gap-2">
          <mat-icon class="w-5 h-5 text-slate-400 dark:text-slate-500">security</mat-icon>
          Thông tin quyền hạn
        </h3>
        <dl class="space-y-1">
          <app-info-item label="Tên quyền" [value]="p.name" icon="badge" [mono]="true" />
          <app-info-item label="Mô tả" [value]="p.description" icon="description" />
          <app-info-item label="ID" [value]="p.id" icon="tag" [mono]="true" />
        </dl>
      </app-card>
    </div>
  } @else {
    <app-empty-state
      variant="no-data"
      icon="security"
      title="Không tìm thấy quyền hạn"
      description="Quyền hạn này có thể đã bị xóa hoặc không tồn tại."
      actionLabel="Quay về danh sách"
      actionIcon="arrow_back"
      actionVariant="primary"
      (actionClick)="goBack()"
    />
  }
</div>
