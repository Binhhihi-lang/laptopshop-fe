<div class="sidebar-wrapper">
  <!-- Logo section -->
  <div class="sidebar-logo">
    <div class="logo-icon">
      <mat-icon>laptop</mat-icon>
    </div>
    <div class="logo-text" *ngIf="!collapsed">
      <div class="logo-title">LaptopShop</div>
      <div class="logo-subtitle">Admin Console</div>
    </div>
    <button class="toggle-collapse-btn" (click)="toggleCollapse()" aria-label="Toggle sidebar">
      <mat-icon>chevron_left</mat-icon>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <mat-nav-list>
      <a mat-list-item
         [routerLink]="['/admin/dashboard']"
         routerLinkActive="active"
         class="nav-item">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle *ngIf="!collapsed">Dashboard</span>
      </a>

      <a mat-list-item
         [routerLink]="['/admin/users']"
         routerLinkActive="active"
         class="nav-item">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle *ngIf="!collapsed">Người dùng</span>
      </a>

      <a mat-list-item
         [routerLink]="['/admin/products']"
         routerLinkActive="active"
         class="nav-item">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle *ngIf="!collapsed">Sản phẩm</span>
      </a>

      <a mat-list-item
         [routerLink]="['/admin/categories']"
         routerLinkActive="active"
         class="nav-item">
        <mat-icon matListItemIcon>category</mat-icon>
        <span matListItemTitle *ngIf="!collapsed">Danh mục</span>
      </a>

      <a mat-list-item
         [routerLink]="['/admin/coupons']"
         routerLinkActive="active"
         class="nav-item">
        <mat-icon matListItemIcon>local_offer</mat-icon>
        <span matListItemTitle *ngIf="!collapsed">Mã giảm giá</span>
      </a>

      <a mat-list-item
         [routerLink]="['/admin/roles']"
         routerLinkActive="active"
         class="nav-item">
        <mat-icon matListItemIcon>shield</mat-icon>
        <span matListItemTitle *ngIf="!collapsed">Vai trò</span>
      </a>

      <a mat-list-item
         [routerLink]="['/admin/permissions']"
         routerLinkActive="active"
         class="nav-item">
        <mat-icon matListItemIcon>key</mat-icon>
        <span matListItemTitle *ngIf="!collapsed">Quyền</span>
      </a>
    </mat-nav-list>
  </nav>
</div>
