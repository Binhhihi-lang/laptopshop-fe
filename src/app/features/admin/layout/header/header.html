<!-- Header toolbar - Modern Clean with Dark Mode -->
<header class="sticky top-0 z-[100] h-16 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700">
  <div class="h-full max-w-screen-2xl mx-auto px-4 md:px-6 lg:px-8 flex items-center justify-between gap-4">
    <!-- Left: Hamburger + Search -->
    <div class="flex items-center gap-4 flex-1 min-w-0 search-container">
      <!-- Hamburger (mobile only) -->
      <button
        (click)="toggleSidebar.emit()"
        class="lg:hidden p-2 rounded-lg text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
        aria-label="Toggle menu"
        aria-expanded="false">
        <mat-icon class="w-6 h-6">menu</mat-icon>
      </button>

      <!-- Search input with dropdown -->
      <div class="relative flex-1 max-w-xl hidden sm:block">
        <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 dark:text-slate-500">search</mat-icon>
        <input
          #searchInput
          type="search"
          [(ngModel)]="searchQuery"
          (input)="onSearchInput($event)"
          (focus)="onSearchFocus()"
          (blur)="onSearchBlur()"
          (keydown)="onSearchKeydown($event)"
          placeholder="Tìm kiếm sản phẩm, đơn hàng, người dùng... (⌘K)"
          class="w-full h-9 pl-10 pr-4 text-sm bg-slate-100 dark:bg-slate-800 border-0 rounded-lg text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:bg-white dark:focus:bg-slate-800 transition-all"
          aria-label="Search"
          aria-autocomplete="list"
          aria-controls="search-results"
          [attr.aria-expanded]="showSearchResults() && recentSearches().length > 0">

        <!-- Search results dropdown -->
        @if (showSearchResults() && (recentSearches().length > 0 || searchQuery())) {
          <div id="search-results" class="absolute top-full left-0 right-0 mt-1 bg-white dark:bg-slate-800 rounded-lg shadow-lg border border-slate-200 dark:border-slate-700 overflow-hidden z-[200] animate-in fade-in-0 zoom-in-95 duration-150">
            @if (searchQuery()) {
              <div class="px-4 py-2 border-b border-slate-200 dark:border-slate-700">
                <p class="text-sm font-medium text-slate-900 dark:text-white">Tìm kiếm: "{{ searchQuery() }}"</p>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Nhấn Enter để xem kết quả</p>
              </div>
            }
            @if (recentSearches().length > 0) {
              <div class="px-3 py-2 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Tìm kiếm gần đây</p>
                <button
                  (click)="clearRecentSearches()"
                  class="text-xs text-primary hover:text-primary-hover"
                  aria-label="Xóa lịch sử tìm kiếm">
                  Xóa tất cả
                </button>
              </div>
              <div class="max-h-48 overflow-y-auto">
                @for (search of recentSearches(); track search.query) {
                  <button
                    (click)="selectRecentSearch(search)"
                    class="w-full px-4 py-2.5 text-left text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors flex items-center gap-3">
                    <mat-icon class="w-4 h-4 text-slate-400 dark:text-slate-500">history</mat-icon>
                    <span class="truncate">{{ search.query }}</span>
                    <span class="ml-auto text-xs text-slate-400 dark:text-slate-500">{{ getTimeAgo(search.timestamp) }}</span>
                  </button>
                }
              </div>
            }
          </div>
        }
      </div>

      <!-- Search shortcut hint (desktop only) -->
      <span class="hidden lg:inline-flex items-center gap-2 px-2 py-1 text-xs text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-800 rounded">
        <kbd class="px-1.5 py-0.5 bg-white dark:bg-slate-700 rounded text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600">⌘K</kbd>
        Tìm kiếm
      </span>
    </div>

    <!-- Right: Actions -->
    <div class="flex items-center gap-2">
      <!-- Notification bell (shared) -->
      <app-notification-bell />

      <!-- Theme toggle -->
      <button
        (click)="onToggleTheme()"
        class="p-2 rounded-lg text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
        aria-label="{{ isDark() ? 'Chế độ sáng' : 'Chế độ tối' }}"
        [attr.aria-pressed]="isDark()">
        <mat-icon class="w-6 h-6 transition-transform duration-200" [class.rotate-180]="isDark()">{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <!-- User menu (shared) -->
      <app-user-menu [user]="userInfo()" (logout)="logout.emit()" />
    </div>
  </div>
</header>
