<mat-sidenav-container class="container">
  <mat-sidenav
    #sidenav
    class="sidenav"
    [mode]="'side'"
    [opened]="isSidebarOpen"
    (openedStart)="isSidebarOpen = true"
    (closedStart)="isSidebarOpen = false">
    <mat-nav-list>
      <div class="sidebar-header">
        <h2>LaptopShop Admin</h2>
      </div>

      <mat-list-item [routerLink]="['/dashboard']">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </mat-list-item>

      <mat-list-item [routerLink]="['/users']">
        <mat-icon>people</mat-icon>
        <span>Users</span>
      </mat-list-item>

      <mat-list-item [routerLink]="['/products']">
        <mat-icon>inventory_2</mat-icon>
        <span>Products</span>
      </mat-list-item>

      <mat-list-item [routerLink]="['/categories']">
        <mat-icon>category</mat-icon>
        <span>Categories</span>
      </mat-list-item>

      <mat-list-item [routerLink]="['/coupons']">
        <mat-icon>local_offer</mat-icon>
        <span>Coupons</span>
      </mat-list-item>

      <mat-list-item [routerLink]="['/roles']">
        <mat-icon>security</mat-icon>
        <span>Roles</span>
      </mat-list-item>

      <mat-list-item [routerLink]="['/permissions']">
        <mat-icon>gavel</mat-icon>
        <span>Permissions</span>
      </mat-list-item>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="header">
      <button
        type="button"
        aria-label="Toggle sidebar"
        mat-icon-button
        (click)="toggleSidebar()"
        *ngIf="isSidebarOpen">
        <mat-icon>menu</mat-icon>
      </button>
      <span>LaptopShop Admin Dashboard</span>
      <span class="spacer"></span>
      <!-- User info and logout button -->
      <div class="user-info" *ngIf="userInfo">
        <img *ngIf="userInfo.avatar; else noAvatar"
          [src]="userInfo.avatar"
          alt="User avatar"
          class="user-avatar">
        <ng-template #noAvatar>
          <mat-icon class="user-avatar-icon">account_circle</mat-icon>
        </ng-template>
        <span class="user-fullname">{{ userInfo.fullName }}</span>
        <button mat-icon-button [matMenuTriggerFor]="userMenu">
          <mat-icon>more_vert</mat-icon>
        </button>
      </div>
      <mat-menu #userMenu="matMenu">
        <button menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
