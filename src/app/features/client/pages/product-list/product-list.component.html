<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white mb-6">
    Tất cả sản phẩm
  </h1>

  <!-- Filter bar -->
  <app-card padding="lg" class="mb-6">
    <form [formGroup]="form" (ngSubmit)="onApplyFilter()" class="space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <app-form-field id="keyword" label="Từ khóa">
          <app-input
            id="keyword"
            type="search"
            formControlName="keyword"
            placeholder="Tên sản phẩm..."
            icon="search"
          ></app-input>
        </app-form-field>

        <app-form-field id="categoryId" label="Danh mục">
          <app-select
            id="categoryId"
            formControlName="categoryId"
            [options]="categoryOptions"
            placeholder="Tất cả danh mục"
          ></app-select>
        </app-form-field>

        <app-form-field id="factory" label="Hãng">
          <app-select
            id="factory"
            formControlName="factory"
            [options]="brandOptions"
            placeholder="Tất cả hãng"
          ></app-select>
        </app-form-field>

        <app-form-field id="sort" label="Sắp xếp">
          <app-select
            id="sort"
            formControlName="sort"
            [options]="sortOptions"
            placeholder="Sắp xếp theo"
          ></app-select>
        </app-form-field>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
        <app-form-field id="minPrice" label="Giá tối thiểu (VND)">
          <app-input
            id="minPrice"
            type="number"
            formControlName="minPrice"
            placeholder="0"
            min="0"
          ></app-input>
        </app-form-field>
        <app-form-field id="maxPrice" label="Giá tối đa (VND)">
          <app-input
            id="maxPrice"
            type="number"
            formControlName="maxPrice"
            placeholder="Không giới hạn"
            min="0"
          ></app-input>
        </app-form-field>
        <div class="flex items-center gap-2 sm:col-span-2 lg:col-span-2 justify-end">
          <app-button
            type="button"
            label="Đặt lại"
            variant="ghost"
            (click)="onResetFilter()"
          ></app-button>
          <app-button
            type="submit"
            label="Áp dụng"
            variant="primary"
            icon="filter_list"
          ></app-button>
        </div>
      </div>
    </form>
  </app-card>

  @if (isLoading()) {
    <app-loading text="Đang tải sản phẩm..."></app-loading>
  } @else if (products().length === 0) {
    <app-empty-state
      icon="search_off"
      title="Không tìm thấy sản phẩm"
      description="Vui lòng thử bỏ bớt bộ lọc hoặc đổi từ khóa khác."
    ></app-empty-state>
  } @else {
    <p class="text-sm text-slate-500 mb-3">
      Tìm thấy <strong>{{ totalElements() }}</strong> sản phẩm
    </p>

    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
      @for (p of products(); track p.id) {
        <app-product-card [product]="p" />
      }
    </div>

    <app-pagination
      [page]="currentPage()"
      [totalPages]="totalPages()"
      (pageChange)="onPageChange($event)"
      class="block mt-8"
    />
  }
</div>
