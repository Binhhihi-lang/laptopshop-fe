<h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">Tạo tài khoản</h1>
<p class="text-sm text-slate-500 mt-1.5 mb-5">Đăng ký nhanh chóng để bắt đầu mua sắm.</p>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
  <app-form-field id="fullName" label="Họ và tên" [required]="true" [error]="fullNameControl?.touched && fullNameControl?.invalid ? (fullNameControl?.hasError('required') ? 'Vui lòng nhập họ tên' : 'Họ tên tối thiểu 2 ký tự') : ''">
    <app-input
      id="fullName"
      type="text"
      formControlName="fullName"
      placeholder="Nguyễn Văn A"
      autocomplete="name"
      icon="person"
    ></app-input>
  </app-form-field>

  <app-form-field id="email" label="Email" [required]="true" [error]="emailControl?.touched && emailControl?.invalid ? (emailControl?.hasError('required') ? 'Vui lòng nhập email' : 'Email không hợp lệ') : ''">
    <app-input
      id="email"
      type="email"
      formControlName="email"
      placeholder="ban@example.com"
      autocomplete="email"
      icon="email"
    ></app-input>
  </app-form-field>

  <app-form-field id="password" label="Mật khẩu" [required]="true" [error]="passwordControl?.touched && passwordControl?.invalid ? (passwordControl?.hasError('required') ? 'Vui lòng nhập mật khẩu' : 'Mật khẩu tối thiểu 6 ký tự') : ''">
    <app-input
      id="password"
      type="password"
      formControlName="password"
      placeholder="Ít nhất 6 ký tự"
      autocomplete="new-password"
      icon="lock"
      [showPasswordToggle]="true"
    ></app-input>
  </app-form-field>

  <app-form-field id="confirmPassword" label="Xác nhận mật khẩu" [required]="true" [error]="confirmPasswordControl?.touched && confirmPasswordControl?.invalid ? (confirmPasswordControl?.hasError('required') ? 'Vui lòng nhập lại mật khẩu' : 'Mật khẩu xác nhận không khớp') : ''">
    <app-input
      id="confirmPassword"
      type="password"
      formControlName="confirmPassword"
      placeholder="Nhập lại mật khẩu"
      autocomplete="new-password"
      icon="lock"
      [showPasswordToggle]="true"
    ></app-input>
  </app-form-field>

  <app-button
    type="submit"
    label="Đăng ký"
    variant="primary"
    size="lg"
    class="w-full"
    [loading]="isSubmitting()"
    [disabled]="isSubmitting()"
  ></app-button>

  <p class="text-sm text-center text-slate-500">
    Đã có tài khoản?
    <a routerLink="/login" class="font-semibold text-primary-600 hover:underline">Đăng nhập</a>
  </p>
</form>
