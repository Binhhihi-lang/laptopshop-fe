<h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">Đăng nhập</h1>
<p class="text-sm text-slate-500 mt-1.5 mb-5">
  Chào mừng bạn trở lại! Vui lòng đăng nhập để tiếp tục.
</p>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
  <app-form-field id="email" label="Email" [required]="true" [error]="emailControl?.touched && emailControl?.invalid ? (emailControl?.hasError('required') ? 'Vui lòng nhập email' : 'Email không hợp lệ') : ''">
    <app-input
      id="email"
      type="email"
      formControlName="email"
      placeholder="ban@example.com"
      autocomplete="email"
      icon="email"
    ></app-input>
  </app-form-field>

  <app-form-field id="password" label="Mật khẩu" [required]="true" [error]="passwordControl?.touched && passwordControl?.invalid ? (passwordControl?.hasError('required') ? 'Vui lòng nhập mật khẩu' : 'Mật khẩu tối thiểu 6 ký tự') : ''">
    <app-input
      id="password"
      type="password"
      formControlName="password"
      placeholder="Nhập mật khẩu"
      autocomplete="current-password"
      icon="lock"
      [showPasswordToggle]="true"
    ></app-input>
  </app-form-field>

  <div class="flex items-center justify-between gap-3">
    <!-- "Ghi nhớ đăng nhập" chỉ là UI, chưa triển khai gia hạn phiên ở BE -->
    <label class="inline-flex items-center gap-2 text-sm text-slate-600 dark:text-slate-300 cursor-pointer">
      <input
        type="checkbox"
        class="w-4 h-4 accent-primary-600"
        [checked]="rememberMe()"
        (change)="rememberMe.set($any($event.target).checked)"
      />
      Ghi nhớ đăng nhập
    </label>
    <a routerLink="/forgot-password" class="text-sm font-semibold text-primary-600 hover:underline">
      Quên mật khẩu?
    </a>
  </div>

  <app-button
    type="submit"
    label="Đăng nhập"
    variant="primary"
    size="lg"
    class="w-full"
    [loading]="isSubmitting()"
    [disabled]="isSubmitting()"
  ></app-button>

  <p class="text-sm text-center text-slate-500">
    Chưa có tài khoản?
    <a routerLink="/register" class="font-semibold text-primary-600 hover:underline">Đăng ký</a>
  </p>
</form>
