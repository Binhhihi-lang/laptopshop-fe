<h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">Đặt lại mật khẩu</h1>
<p class="text-sm text-slate-500 mt-1.5 mb-5">Nhập mật khẩu mới cho tài khoản của bạn.</p>

@if (!token()) {
  <div class="text-center space-y-4">
    <mat-icon class="!w-16 !h-16 !text-6xl text-danger-500 mx-auto">error</mat-icon>
    <p class="text-slate-600 dark:text-slate-400">
      Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.
    </p>
    <a routerLink="/forgot-password" class="inline-block font-semibold text-primary-600 hover:underline">
      Yêu cầu link mới
    </a>
  </div>
} @else {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <app-form-field id="newPassword" label="Mật khẩu mới" [required]="true" [error]="newPasswordControl?.touched && newPasswordControl?.invalid ? (newPasswordControl?.hasError('required') ? 'Vui lòng nhập mật khẩu' : 'Mật khẩu tối thiểu 6 ký tự') : ''">
      <app-input
        id="newPassword"
        type="password"
        formControlName="newPassword"
        placeholder="Ít nhất 6 ký tự"
        autocomplete="new-password"
        icon="lock"
        [showPasswordToggle]="true"
      ></app-input>
    </app-form-field>

    <app-form-field id="confirmPassword" label="Xác nhận mật khẩu" [required]="true" [error]="confirmPasswordControl?.touched && confirmPasswordControl?.hasError('required') ? 'Vui lòng xác nhận mật khẩu' : ''">
      <app-input
        id="confirmPassword"
        type="password"
        formControlName="confirmPassword"
        placeholder="Nhập lại mật khẩu"
        autocomplete="new-password"
        icon="lock"
        [showPasswordToggle]="true"
      ></app-input>
    </app-form-field>

    <app-button
      type="submit"
      label="Đặt lại mật khẩu"
      variant="primary"
      size="lg"
      class="w-full"
      [loading]="isSubmitting()"
      [disabled]="isSubmitting()"
    ></app-button>
  </form>
}
