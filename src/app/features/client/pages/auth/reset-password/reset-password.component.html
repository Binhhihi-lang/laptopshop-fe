<div class="min-h-[calc(100vh-200px)] flex items-center justify-center px-4 py-12 bg-slate-50 dark:bg-slate-950">
  <app-card padding="lg" class="w-full max-w-md">
    <app-card-header
      title="Đặt lại mật khẩu"
      subtitle="Nhập mật khẩu mới cho tài khoản của bạn"
      icon="lock"
    ></app-card-header>

    @if (!token()) {
      <div class="text-center space-y-4">
        <mat-icon class="!w-16 !h-16 text-danger-500 mx-auto">error</mat-icon>
        <p class="text-slate-600 dark:text-slate-400">
          Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.
        </p>
        <a routerLink="/forgot-password" class="text-primary-600 hover:underline">
          Yêu cầu link mới
        </a>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <app-form-field id="newPassword" label="Mật khẩu mới" [required]="true" [error]="newPasswordControl?.touched && newPasswordControl?.invalid ? (newPasswordControl?.hasError('required') ? 'Vui lòng nhập mật khẩu' : 'Mật khẩu tối thiểu 6 ký tự') : ''">
          <app-input
            id="newPassword"
            type="password"
            formControlName="newPassword"
            placeholder="••••••••"
            autocomplete="new-password"
            icon="lock"
            [showPasswordToggle]="true"
          ></app-input>
        </app-form-field>

        <app-form-field id="confirmPassword" label="Xác nhận mật khẩu" [required]="true" [error]="confirmPasswordControl?.touched && confirmPasswordControl?.hasError('required') ? 'Vui lòng xác nhận mật khẩu' : ''">
          <app-input
            id="confirmPassword"
            type="password"
            formControlName="confirmPassword"
            placeholder="••••••••"
            autocomplete="new-password"
            icon="lock"
            [showPasswordToggle]="true"
          ></app-input>
        </app-form-field>

        <app-button
          type="submit"
          label="Đặt lại mật khẩu"
          variant="primary"
          size="lg"
          class="w-full"
          [loading]="isSubmitting()"
          [disabled]="isSubmitting()"
        ></app-button>
      </form>
    }
  </app-card>
</div>
