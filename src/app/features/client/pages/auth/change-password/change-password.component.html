<div class="max-w-2xl mx-auto px-4 py-8">
  <app-page-header
    title="Đổi mật khẩu"
    subtitle="Đổi mật khẩu định kỳ giúp bảo vệ tài khoản của bạn"
  ></app-page-header>

  <app-card padding="lg">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <app-form-field id="oldPassword" label="Mật khẩu hiện tại" [required]="true" [error]="oldPasswordControl?.touched && oldPasswordControl?.invalid ? (oldPasswordControl?.hasError('required') ? 'Vui lòng nhập mật khẩu' : 'Mật khẩu tối thiểu 6 ký tự') : ''">
        <app-input
          id="oldPassword"
          type="password"
          formControlName="oldPassword"
          placeholder="••••••••"
          autocomplete="current-password"
          icon="lock"
          [showPasswordToggle]="true"
        ></app-input>
      </app-form-field>

      <app-form-field id="newPassword" label="Mật khẩu mới" [required]="true" [error]="newPasswordControl?.touched && newPasswordControl?.invalid ? (newPasswordControl?.hasError('required') ? 'Vui lòng nhập mật khẩu' : 'Mật khẩu tối thiểu 6 ký tự') : ''">
        <app-input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          placeholder="••••••••"
          autocomplete="new-password"
          icon="lock"
          [showPasswordToggle]="true"
        ></app-input>
      </app-form-field>

      <app-form-field id="confirmPassword" label="Xác nhận mật khẩu mới" [required]="true" [error]="confirmPasswordControl?.touched && confirmPasswordControl?.hasError('required') ? 'Vui lòng xác nhận mật khẩu' : ''">
        <app-input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="••••••••"
          autocomplete="new-password"
          icon="lock"
          [showPasswordToggle]="true"
        ></app-input>
      </app-form-field>

      <div class="flex items-center gap-3 justify-end pt-2">
        <a routerLink="/profile" class="text-sm text-slate-500 hover:underline">
          Hủy
        </a>
        <app-button
          type="submit"
          label="Đổi mật khẩu"
          variant="primary"
          [loading]="isSubmitting()"
          [disabled]="isSubmitting()"
        ></app-button>
      </div>
    </form>
  </app-card>
</div>
