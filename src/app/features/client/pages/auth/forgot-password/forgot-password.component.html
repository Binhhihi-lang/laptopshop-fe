<h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">Quên mật khẩu?</h1>
<p class="text-sm text-slate-500 mt-1.5 mb-5">
  Nhập email đã đăng ký, chúng tôi sẽ gửi link đặt lại mật khẩu.
</p>

@if (isSent()) {
  <div class="space-y-4 text-center">
    <mat-icon class="!w-16 !h-16 !text-6xl text-success-500 mx-auto">mark_email_read</mat-icon>
    <p class="text-slate-600 dark:text-slate-400">
      Vui lòng kiểm tra hộp thư của bạn. Link đặt lại có hiệu lực trong vòng 60 phút.
    </p>
    <a routerLink="/login" class="inline-block font-semibold text-primary-600 hover:underline">
      ← Quay lại đăng nhập
    </a>
  </div>
} @else {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <app-form-field id="email" label="Email" [required]="true" [error]="emailControl?.touched && emailControl?.invalid ? (emailControl?.hasError('required') ? 'Vui lòng nhập email' : 'Email không hợp lệ') : ''">
      <app-input
        id="email"
        type="email"
        formControlName="email"
        placeholder="ban@example.com"
        autocomplete="email"
        icon="email"
      ></app-input>
    </app-form-field>

    <app-button
      type="submit"
      label="Gửi link đặt lại"
      variant="primary"
      size="lg"
      class="w-full"
      [loading]="isSubmitting()"
      [disabled]="isSubmitting()"
    ></app-button>

    <p class="text-sm text-center text-slate-500">
      <a routerLink="/login" class="font-semibold text-primary-600 hover:underline">
        ← Quay lại đăng nhập
      </a>
    </p>
  </form>
}
