<div class="min-h-[calc(100vh-200px)] flex items-center justify-center px-4 py-12 bg-slate-50 dark:bg-slate-950">
  <app-card padding="lg" class="w-full max-w-md">
    <app-card-header
      title="Quên mật khẩu"
      subtitle="Nhập email để nhận link đặt lại mật khẩu"
      icon="lock_reset"
    ></app-card-header>

    @if (isSent()) {
      <div class="space-y-4 text-center">
        <mat-icon class="!w-16 !h-16 text-success-500 mx-auto">mark_email_read</mat-icon>
        <p class="text-slate-600 dark:text-slate-400">
          Vui lòng kiểm tra hộp thư của bạn. Link đặt lại có hiệu lực trong vòng 60 phút.
        </p>
        <a routerLink="/login" class="text-primary-600 hover:underline inline-block">
          Quay lại đăng nhập
        </a>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <app-form-field id="email" label="Email" [required]="true" [error]="emailControl?.touched && emailControl?.invalid ? (emailControl?.hasError('required') ? 'Vui lòng nhập email' : 'Email không hợp lệ') : ''">
          <app-input
            id="email"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            autocomplete="email"
            icon="email"
          ></app-input>
        </app-form-field>

        <app-button
          type="submit"
          label="Gửi link đặt lại"
          variant="primary"
          size="lg"
          class="w-full"
          [loading]="isSubmitting()"
          [disabled]="isSubmitting()"
        ></app-button>

        <div class="text-sm text-center text-slate-600 dark:text-slate-400">
          <a routerLink="/login" class="text-primary-600 hover:underline">Quay lại đăng nhập</a>
        </div>
      </form>
    }
  </app-card>
</div>
