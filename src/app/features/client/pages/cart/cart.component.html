<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <app-breadcrumb
    [items]="[{ label: 'Trang chủ', link: '/' }, { label: 'Giỏ hàng' }]"
    class="block mb-6"
  />

  <h1 class="text-2xl font-bold mb-6">Giỏ hàng</h1>

  @if (isLoading()) {
    <app-loading />
  } @else if (!isAuthenticated()) {
    <app-empty-state
      icon="shopping_cart"
      title="Đăng nhập để xem giỏ hàng"
      description="Vui lòng đăng nhập để tiếp tục mua sắm và thanh toán."
      [actionLabel]="'Đăng nhập'"
      [actionIcon]="'login'"
      (actionClick)="goLogin()"
    />
  } @else if (cart() && cart()!.items.length > 0) {
    <div class="grid lg:grid-cols-[1fr_360px] gap-6 items-start">
      <div class="flex flex-col gap-3.5">
        @for (item of cart()!.items; track item.id) {
          <app-cart-line-item
            [item]="item"
            (quantityChange)="updateQty(item, $event)"
            (remove)="removeItem(item)"
          />
        }
      </div>

      <aside class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-5 lg:sticky lg:top-24">
        <h2 class="font-semibold mb-4">Tóm tắt đơn hàng</h2>

        <!-- G8/D17: một luồng chọn ưu đãi duy nhất, dùng chung với trang thanh toán -->
        <button
          type="button"
          class="w-full flex items-center gap-3 px-3 py-3 mb-4 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-primary-400 text-left transition"
          (click)="openOverlay()"
        >
          <span class="shrink-0 w-8 h-8 rounded-lg bg-primary-50 dark:bg-primary-950/40 grid place-items-center text-primary-600 dark:text-primary-400">
            <mat-icon class="!w-4 !h-4 !text-[18px] !leading-none">sell</mat-icon>
          </span>
          <span class="flex-1 min-w-0">
            <b class="block text-sm font-semibold truncate">
              @if (totalSaving() > 0) {
                Đã chọn ưu đãi và khuyến mại
              } @else {
                Chọn ưu đãi và khuyến mại
              }
            </b>
            <span class="block text-xs text-slate-500 dark:text-slate-400 truncate">
              @if (totalSaving() > 0) {
                Tiết kiệm {{ formatMoney(totalSaving()) }}
              } @else {
                Voucher, voucher
              }
            </span>
          </span>
          <mat-icon class="!w-4 !h-4 !text-[18px] !leading-none text-slate-400">chevron_right</mat-icon>
        </button>

        <app-order-summary
          [subtotal]="cart()!.subtotal"
          [discount]="voucherDiscount()"
          [promotionDiscount]="cart()!.promotionDiscount"
          [voucherDiscount]="voucherPreviewDiscount()"
          [forfeitedAmount]="voucherForfeited()"
          [shippingFee]="cart()!.shippingFee"
          [total]="finalTotal(cart()!)"
        />

        <a
          routerLink="/checkout"
          [queryParams]="checkoutQueryParams()"
          class="mt-5 w-full inline-flex items-center justify-center px-4 py-3 rounded-lg bg-primary-600 text-white font-semibold hover:bg-primary-700"
        >
          Thanh toán
        </a>
      </aside>
    </div>
  } @else {
    <app-empty-state
      icon="shopping_cart"
      title="Giỏ hàng trống"
      description="Chưa có sản phẩm nào trong giỏ hàng của bạn."
      [actionLabel]="'Khám phá sản phẩm'"
      [actionIcon]="'storefront'"
      (actionClick)="goShop()"
    />
  }
</div>

@if (isOverlayOpen()) {
  <app-promo-overlay
    [promotions]="cart()?.promotions ?? []"
    [vouchers]="vouchers()"
    [selectedVoucherId]="selectedVoucherId()"
    [voucherCode]="voucherCode()"
    [voucherNote]="voucherNote()"
    [voucherValid]="voucherValid() ?? false"
    [applyingVoucher]="isApplyingVoucher()"
    [totalSaving]="totalSaving()"
    [voucherDiscount]="voucherPreviewDiscount()"
    [forfeitedAmount]="voucherForfeited()"
    (closed)="closeOverlay()"
    (voucherCodeChange)="voucherCode.set($event)"
    (applyVoucher)="applyVoucher()"
    (voucherChange)="onVoucherChange($event)"
  />
}
