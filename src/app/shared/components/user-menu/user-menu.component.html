<!-- User avatar + dropdown menu (shared, reusable for admin & client) -->
<div class="relative user-menu-container ml-1">
  <button
    (click)="toggle()"
    class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
    aria-label="Menu người dùng"
    [attr.aria-expanded]="showMenu()"
    aria-haspopup="true">
    <app-avatar
      [src]="user()?.avatar || ''"
      [initials]="initials()"
      [alt]="displayName()"
      size="sm"
      shape="circle"
      [shadow]="'sm'" />
    <span class="hidden lg:block text-sm font-medium text-slate-700 dark:text-slate-200 truncate max-w-[120px]">{{ displayName() }}</span>
    <mat-icon class="w-5 h-5 text-slate-400 hidden lg:block transition-transform duration-200" [class.rotate-180]="showMenu()">expand_more</mat-icon>
  </button>

  @if (showMenu()) {
    <div
      class="absolute right-0 mt-2 w-52 bg-white dark:bg-slate-800 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 py-1 z-[200] animate-in fade-in-0 zoom-in-95 duration-150">
      <div class="px-4 py-3 border-b border-slate-200 dark:border-slate-700">
        <p class="text-sm font-medium text-slate-900 dark:text-white truncate">{{ displayName() }}</p>
        <p class="text-xs text-slate-500 dark:text-slate-400 truncate">{{ user()?.email || 'admin@laptopshop.vn' }}</p>
        <div class="mt-2">
          <app-badge [label]="roleName()" variant="primary" size="sm" />
        </div>
      </div>
      <button
        (click)="navigate('/admin/profile')"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">
        <mat-icon class="w-5 h-5">person</mat-icon>
        Hồ sơ cá nhân
      </button>
      <button
        (click)="navigate('/admin/settings')"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">
        <mat-icon class="w-5 h-5">settings</mat-icon>
        Cài đặt
      </button>
      <hr class="my-1 border-slate-200 dark:border-slate-700" />
      <button
        (click)="navigate('/admin/help')"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">
        <mat-icon class="w-5 h-5">help_outline</mat-icon>
        Trợ giúp
      </button>
      <hr class="my-1 border-slate-200 dark:border-slate-700" />
      <button
        (click)="onLogout()"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20">
        <mat-icon class="w-5 h-5">logout</mat-icon>
        Đăng xuất
      </button>
    </div>
  }
</div>
