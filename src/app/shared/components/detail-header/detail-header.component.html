<div class="sticky top-16 z-[90] bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
  <div class="max-w-6xl mx-auto px-4 md:px-6 lg:px-8 py-4">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        @if (showBack()) {
          <app-button
            variant="ghost"
            icon="arrow_back"
            [label]="backLabel()"
            [ariaLabel]="backAriaLabel() || backLabel()"
            (click)="backClick.emit()"
          />
        }
        <div class="min-w-0">
          <h1 class="text-xl font-bold text-slate-900 dark:text-white truncate">{{ title() }}</h1>
          <ng-content select="[headerIdentity]"></ng-content>
        </div>
      </div>
      <div class="flex items-center gap-3 flex-wrap">
        <ng-content select="[headerBadges]"></ng-content>
        <ng-content select="[headerActions]"></ng-content>
      </div>
    </div>
  </div>
</div>
