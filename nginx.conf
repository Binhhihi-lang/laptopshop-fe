server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular là ứng dụng một trang: mọi đường dẫn con như /admin/vouchers
    # không tồn tại dưới dạng file. Không có dòng try_files này thì khách bấm
    # F5 ở bất kỳ trang con nào sẽ nhận lỗi 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File có hash trong tên (Angular bật outputHashing) nên nội dung không
    # bao giờ đổi -> cache dài hạn cho nhẹ máy khách.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html thì ngược lại: PHẢI không cache, nếu không khách sẽ mãi thấy
    # bản cũ sau mỗi lần deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
